<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern multimedia platform hub showcasing gaming, music, movies, and art with immersive interactive experiences.">
    <meta name="theme-color" content="#0f0f1a">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>MediaHub — Multimedia Platforms</title>
    <style>
        :root {
            --color-bg: #0a0a0f;
            --color-surface: #151520;
            --color-accent-gaming: #ff4757;
            --color-accent-music: #7bed9f;
            --color-accent-movies: #ffa502;
            --color-accent-art: #a29bfe;
            --glow-intensity: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background: var(--color-bg);
            color-scheme: dark;
        }

        body {
            font-family: 'Pixelify Sans', cursive;
            background: var(--color-bg);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Particle Background Canvas */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        /* Main container */
        .main-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        /* Title styling */
        .title {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 600;
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, #fff 0%, #a8a8b3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.02em;
        }

        /* Media Hub Grid */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: clamp(1.5rem, 4vw, 3rem);
            width: 100%;
            max-width: 800px;
            padding: 0 1rem;
        }

        @media (min-width: 640px) {
            .media-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* Media Hub Item */
        .media-hub {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            outline: none;
        }

        .media-hub:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 8px;
            border-radius: 50%;
        }

        /* Circle Container */
        .hub-circle {
            position: relative;
            width: clamp(100px, 25vw, 140px);
            height: clamp(100px, 25vw, 140px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-surface);
            border: 2px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.4s ease,
                        border-color 0.3s ease;
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* Gaming hub */
        .media-hub[data-type="gaming"] .hub-circle {
            --hub-color: var(--color-accent-gaming);
        }
        /* Music hub */
        .media-hub[data-type="music"] .hub-circle {
            --hub-color: var(--color-accent-music);
        }
        /* Movies hub */
        .media-hub[data-type="movies"] .hub-circle {
            --hub-color: var(--color-accent-movies);
        }
        /* Art hub */
        .media-hub[data-type="art"] .hub-circle {
            --hub-color: var(--color-accent-art);
        }

        /* Gradient ring background */
        .hub-circle::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                var(--hub-color, #fff) 0%,
                transparent 30%,
                transparent 70%,
                var(--hub-color, #fff) 100%
            );
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.6s ease;
            z-index: -1;
        }

        /* Inner glow */
        .hub-circle::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(
                circle at 30% 30%,
                var(--hub-color, #fff) 0%,
                transparent 60%
            );
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        /* Radial Progress Ring SVG */
        .progress-ring {
            position: absolute;
            inset: -8px;
            width: calc(100% + 16px);
            height: calc(100% + 16px);
            transform: rotate(-90deg);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .progress-ring circle {
            fill: none;
            stroke: var(--hub-color, #fff);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-dasharray: 440;
            stroke-dashoffset: 440;
            transition: stroke-dashoffset 0.6s ease;
            filter: drop-shadow(0 0 6px var(--hub-color, #fff));
        }

        /* Hover/Active States */
        .media-hub:hover .hub-circle,
        .media-hub:focus .hub-circle {
            transform: translateY(-12px) scale(1.05);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.4),
                0 0 60px rgba(var(--hub-color-rgb, 255, 255, 255), 0.2);
            border-color: var(--hub-color, rgba(255, 255, 255, 0.3));
        }

        .media-hub:hover .hub-circle::before,
        .media-hub:focus .hub-circle::before {
            opacity: 0.6;
            transform: rotate(180deg);
        }

        .media-hub:hover .hub-circle::after,
        .media-hub:focus .hub-circle::after {
            opacity: 0.15;
        }

        .media-hub:hover .progress-ring,
        .media-hub:focus .progress-ring {
            opacity: 1;
        }

        .media-hub:hover .progress-ring circle,
        .media-hub:focus .progress-ring circle {
            stroke-dashoffset: 0;
        }

        /* Icon styling */
        .hub-icon {
            font-size: clamp(2rem, 6vw, 3rem);
            filter: grayscale(0.3);
            transition: filter 0.3s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1;
        }

        .media-hub:hover .hub-icon,
        .media-hub:focus .hub-icon {
            filter: grayscale(0) drop-shadow(0 0 10px var(--hub-color, #fff));
            transform: scale(1.15);
        }

        /* Sound wave pulse effect for music */
        .sound-waves {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }

        .sound-waves::before,
        .sound-waves::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid var(--hub-color, #fff);
            animation: none;
        }

        .media-hub[data-type="music"]:hover .sound-waves,
        .media-hub[data-type="music"]:focus .sound-waves {
            opacity: 1;
        }

        .media-hub[data-type="music"]:hover .sound-waves::before,
        .media-hub[data-type="music"]:focus .sound-waves::before {
            animation: pulse-wave 1.5s ease-out infinite;
        }

        .media-hub[data-type="music"]:hover .sound-waves::after,
        .media-hub[data-type="music"]:focus .sound-waves::after {
            animation: pulse-wave 1.5s ease-out infinite 0.4s;
        }

        @keyframes pulse-wave {
            0% {
                transform: scale(1);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }

        /* Floating particles for art */
        .art-particles {
            position: absolute;
            inset: -20px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .media-hub[data-type="art"]:hover .art-particles,
        .media-hub[data-type="art"]:focus .art-particles {
            opacity: 1;
        }

        .art-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--hub-color, #fff);
            border-radius: 50%;
            animation: float-particle 2s ease-in-out infinite;
        }

        .art-particle:nth-child(1) { top: 10%; left: 20%; animation-delay: 0s; }
        .art-particle:nth-child(2) { top: 80%; left: 30%; animation-delay: 0.3s; }
        .art-particle:nth-child(3) { top: 30%; right: 15%; animation-delay: 0.6s; }
        .art-particle:nth-child(4) { bottom: 20%; right: 25%; animation-delay: 0.9s; }
        .art-particle:nth-child(5) { top: 50%; left: 10%; animation-delay: 1.2s; }

        @keyframes float-particle {
            0%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translateY(-15px) scale(1.3);
                opacity: 1;
            }
        }

        /* Gaming controller vibration effect */
        .media-hub[data-type="gaming"]:hover .hub-icon,
        .media-hub[data-type="gaming"]:focus .hub-icon {
            animation: gaming-shake 0.3s ease-in-out;
        }

        @keyframes gaming-shake {
            0%, 100% { transform: scale(1.15) rotate(0deg); }
            25% { transform: scale(1.15) rotate(-3deg); }
            75% { transform: scale(1.15) rotate(3deg); }
        }

        /* Movie film grain effect */
        .media-hub[data-type="movies"] .hub-circle {
            position: relative;
        }

        .media-hub[data-type="movies"]:hover .hub-circle,
        .media-hub[data-type="movies"]:focus .hub-circle {
            animation: movie-flicker 0.1s ease-in-out infinite alternate;
        }

        @keyframes movie-flicker {
            0% { filter: brightness(1); }
            100% { filter: brightness(1.05); }
        }

        /* Label/Tooltip */
        .hub-label {
            margin-top: 1.25rem;
            font-size: 1rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
            opacity: 0.7;
            position: relative;
        }

        .hub-label::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 100%;
            height: 2px;
            background: var(--hub-color, #fff);
            transition: transform 0.3s ease;
        }

        .media-hub:hover .hub-label,
        .media-hub:focus .hub-label {
            color: var(--hub-color, #fff);
            opacity: 1;
            transform: translateY(4px);
        }

        .media-hub:hover .hub-label::after,
        .media-hub:focus .hub-label::after {
            transform: translateX(-50%) scaleX(1);
        }

        /* Screen reader only text */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Touch device optimizations */
        @media (pointer: coarse) {
            .media-hub:active .hub-circle {
                transform: translateY(-8px) scale(1.03);
            }
        }
    </style>
</head>
<body>
    <canvas id="particle-canvas" aria-hidden="true"></canvas>
    
    <main class="main-container">
        <h1 class="title">Multimedia Platforms Hub</h1>
        
        <section 
            class="media-grid" 
            role="region" 
            aria-label="Media platform categories"
        >
            <!-- Gaming Hub -->
            <article 
                class="media-hub" 
                data-type="gaming"
                tabindex="0"
                role="button"
                aria-label="Gaming platform - Click to explore gaming content"
            >
                <div class="hub-circle" style="--hub-color-rgb: 255, 71, 87;">
                    <svg class="progress-ring" viewBox="0 0 160 160" aria-hidden="true">
                        <circle cx="80" cy="80" r="70"/>
                    </svg>
                    <span class="hub-icon" aria-hidden="true">🎮</span>
                </div>
                <p class="hub-label">Gaming</p>
            </article>

            <!-- Music Hub -->
            <article 
                class="media-hub" 
                data-type="music"
                tabindex="0"
                role="button"
                aria-label="Music platform - Click to explore music content"
            >
                <div class="hub-circle" style="--hub-color-rgb: 123, 237, 159;">
                    <svg class="progress-ring" viewBox="0 0 160 160" aria-hidden="true">
                        <circle cx="80" cy="80" r="70"/>
                    </svg>
                    <div class="sound-waves" aria-hidden="true"></div>
                    <span class="hub-icon" aria-hidden="true">🎵</span>
                </div>
                <p class="hub-label">Music</p>
            </article>

            <!-- Movies Hub -->
            <article 
                class="media-hub" 
                data-type="movies"
                tabindex="0"
                role="button"
                aria-label="Movies platform - Click to explore movie content"
            >
                <div class="hub-circle" style="--hub-color-rgb: 255, 165, 2;">
                    <svg class="progress-ring" viewBox="0 0 160 160" aria-hidden="true">
                        <circle cx="80" cy="80" r="70"/>
                    </svg>
                    <span class="hub-icon" aria-hidden="true">🎬</span>
                </div>
                <p class="hub-label">Movies</p>
            </article>

            <!-- Art Hub -->
            <article 
                class="media-hub" 
                data-type="art"
                tabindex="0"
                role="button"
                aria-label="Art platform - Click to explore art content"
            >
                <div class="hub-circle" style="--hub-color-rgb: 162, 155, 254;">
                    <svg class="progress-ring" viewBox="0 0 160 160" aria-hidden="true">
                        <circle cx="80" cy="80" r="70"/>
                    </svg>
                    <div class="art-particles" aria-hidden="true">
                        <div class="art-particle"></div>
                        <div class="art-particle"></div>
                        <div class="art-particle"></div>
                        <div class="art-particle"></div>
                        <div class="art-particle"></div>
                    </div>
                    <span class="hub-icon" aria-hidden="true">🎨</span>
                </div>
                <p class="hub-label">Art</p>
            </article>
        </section>
    </main>

    <script>
        // Particle background system
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;
        let isActive = true;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.hue = Math.random() * 60 + 240; // Blue-purple range
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width || 
                    this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 70%, 60%, ${this.opacity})`;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const particleCount = Math.min(50, Math.floor((canvas.width * canvas.height) / 25000));
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function drawConnections() {
            const maxDistance = 100;
            const maxConnections = 3;

            for (let i = 0; i < particles.length; i++) {
                let connections = 0;
                for (let j = i + 1; j < particles.length && connections < maxConnections; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < maxDistance) {
                        const opacity = (1 - distance / maxDistance) * 0.15;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(150, 150, 200, ${opacity})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                        connections++;
                    }
                }
            }
        }

        function animate() {
            if (!isActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            drawConnections();
            animationId = requestAnimationFrame(animate);
        }

        // Visibility API to pause when not visible
        document.addEventListener('visibilitychange', () => {
            isActive = !document.hidden;
            if (isActive) animate();
        });

        // Initialize
        resizeCanvas();
        initParticles();
        animate();

        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });

        // Media hub interactions
        document.querySelectorAll('.media-hub').forEach(hub => {
            hub.addEventListener('click', () => {
                const type = hub.dataset.type;
                console.log(`Opening ${type} platform...`);
                // Add actual navigation logic here
            });

            hub.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    hub.click();
                }
            });
        });

        // Subtle mouse parallax effect
        let mouseX = 0;
        let mouseY = 0;
        let currentX = 0;
        let currentY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.01;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.01;
        }, { passive: true });

        function updateParallax() {
            currentX += (mouseX - currentX) * 0.05;
            currentY += (mouseY - currentY) * 0.05;

            document.querySelectorAll('.hub-circle').forEach((circle, index) => {
                const depth = 1 + (index * 0.1);
                circle.style.transform = `translate(${currentX * depth}px, ${currentY * depth}px)`;
            });

            requestAnimationFrame(updateParallax);
        }

        // Only enable parallax on non-touch devices
        if (!window.matchMedia('(pointer: coarse)').matches) {
            updateParallax();
        }
    </script>
</body>
</html>
